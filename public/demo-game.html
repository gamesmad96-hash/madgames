<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08080b;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:16px;left:16px;padding:9px 12px;border-radius:12px;background:#0008;backdrop-filter:blur(8px);font-weight:800}.tip{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:#0008;color:#bbb;font-size:12px;white-space:nowrap}.joy{display:none;position:fixed;left:18px;bottom:18px;width:112px;height:112px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff24}.knob{position:absolute;width:46px;height:46px;border-radius:50%;background:#fff3;left:33px;top:33px;transform:translate(0,0)}@media(pointer:coarse){.joy{display:block}.tip{bottom:18px;left:auto;right:18px;transform:none;max-width:160px;white-space:normal;text-align:right}}</style></head><body><canvas id="c"></canvas><div class="hud">Score: <span id="s">0</span></div><div class="tip">WASD / arrows or touch joystick • collect green orbs</div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),score=document.getElementById('s'),joy=document.getElementById('joy'),knob=document.getElementById('knob');let W,H,p={x:200,y:200,r:15},t={x:400,y:250,r:11},s=0,keys={},touch={x:0,y:0};function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;W=innerWidth;H=innerHeight;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function nt(){t.x=30+Math.random()*(W-60);t.y=30+Math.random()*(H-60)}function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,max=32,mag=Math.min(max,len);touch.x=(dx/len)*(mag/max);touch.y=(dy/len)*(mag/max);knob.style.transform=`translate(${touch.x*max}px,${touch.y*max}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)});function clearJoy(){touch={x:0,y:0};knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',clearJoy);joy.addEventListener('pointercancel',clearJoy);function loop(){let v=4;if(keys.w||keys.arrowup)p.y-=v;if(keys.s||keys.arrowdown)p.y+=v;if(keys.a||keys.arrowleft)p.x-=v;if(keys.d||keys.arrowright)p.x+=v;p.x+=touch.x*v;p.y+=touch.y*v;p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));if(Math.hypot(p.x-t.x,p.y-t.y)<p.r+t.r){s++;score.textContent=s;nt()}x.clearRect(0,0,W,H);let g=x.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,Math.max(W,H));g.addColorStop(0,'#301742');g.addColorStop(1,'#08080b');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#d8ff3e';x.shadowBlur=22;x.shadowColor='#d8ff3e';x.beginPath();x.arc(t.x,t.y,t.r,0,7);x.fill();x.shadowBlur=20;x.shadowColor='#a04cff';x.fillStyle='#9c55ff';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.shadowBlur=0;requestAnimationFrame(loop)}nt();loop()</script></body></html>
